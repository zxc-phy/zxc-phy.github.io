<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>囡囡，生日快乐</title>
    <meta name="description" content="一份写给囡囡的生日告白。" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;500;600&family=Cinzel:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="locked">
    <!-- 漂浮爱心层（贯穿全程） -->
    <div class="hearts" id="hearts" aria-hidden="true"></div>

    <!-- ========== 第一幕：开场 · 流光丝带（静音） ========== -->
    <section class="intro" id="intro" aria-label="开场">
      <canvas class="intro__canvas" id="tendrilCanvas" aria-hidden="true"></canvas>
      <div class="intro__content">
        <pre class="intro__terminal" id="introTerminal" aria-hidden="true"></pre>
        <h1 class="intro__title" id="introTitle"></h1>
        <p class="intro__subtitle" id="introSubtitle"></p>
        <p class="intro__line" id="introLine"></p>
        <button class="intro__start" id="startButton" type="button"></button>
        <p class="intro__hint" id="introHint"></p>
      </div>
    </section>

    <!-- ========== 进度 & 音乐控制 ========== -->
    <div class="scroll-progress" id="scrollProgress" aria-hidden="true"><span></span></div>
    <button class="music-toggle is-hidden" id="musicToggle" type="button" aria-label="播放/暂停音乐">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
        <path id="musicIconPath" d="M9 18V5l12-2v13" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="6" cy="18" r="3" fill="none" stroke="currentColor" stroke-width="1.6"/>
        <circle cx="18" cy="16" r="3" fill="none" stroke="currentColor" stroke-width="1.6"/>
      </svg>
    </button>

    <!-- ========== 第二幕 + 第三幕：滚动叙事 ========== -->
    <main class="story" id="story" aria-label="我们的故事">
      <!-- 故事页由 app.js 注入 -->
      <div id="pages"></div>

      <!-- 第三幕：表白 -->
      <section class="finale" id="finale" aria-label="表白">
        <canvas class="finale__canvas" id="finaleCanvas" aria-hidden="true"></canvas>

        <div class="finale__step" data-step="prelude">
          <p class="finale__prelude" id="finalePrelude"></p>
        </div>

        <div class="finale__step" data-step="letter">
          <div class="finale__letter">
            <p class="finale__typed" id="finaleTyped"></p>
            <span class="finale__cursor" id="finaleCursor">▍</span>
          </div>
        </div>

        <div class="finale__step" data-step="big">
          <h2 class="finale__big" id="finaleBig"></h2>
        </div>

        <div class="finale__step" data-step="words">
          <blockquote class="finale__words" id="finaleWords"></blockquote>
        </div>

        <div class="finale__step" data-step="wang">
          <blockquote class="finale__wang" id="finaleWang"></blockquote>
          <cite class="finale__wangby" id="finaleWangBy"></cite>
        </div>

        <div class="finale__step" data-step="ending">
          <h2 class="finale__ending" id="finaleEnding"></h2>
          <p class="finale__closing" id="finaleClosing"></p>
          <button class="finale__replay" id="replayButton" type="button"></button>
        </div>
      </section>
    </main>

    <!-- 下滑提示 -->
    <div class="scroll-cue is-hidden" id="scrollCue" aria-hidden="true">
      <span></span>
    </div>

    <audio id="bgm" preload="auto" loop>
      <source src="./assets/music/bgm.mp3" type="audio/mpeg" />
    </audio>

    <script src="./content.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
